name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.stage }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        stage: [stage1, stage2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.stage }}

      - name: Install just
        uses: extractions/setup-just@v4

      # Not cached: caching cargo-installed binaries makes `cargo install` skip
      # a reinstall even when a newer version is published, so the gate would
      # quietly keep testing against a stale tool. cargo-llvm-cov is crap4rust's
      # own coverage backend rather than a house tool, but it is missing from a
      # fresh runner just the same.
      - name: Install house gate tools
        if: matrix.stage == 'stage2'
        run: |
          cargo install cargo-stern4rust
          cargo install cargo-twin4rust
          cargo install cargo-iceberg4rust
          cargo install cargo-llvm-cov

      # This repository is crap4rust. The gate measures it with the published
      # crap4rust rather than the one in the working tree, matching what the
      # PowerShell gate did.
      - name: Install crap4rust
        if: matrix.stage == 'stage2'
        run: cargo install cargo-crap4rust

      - name: Run ${{ matrix.stage }}
        run: just ${{ matrix.stage }}
