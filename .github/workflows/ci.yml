name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.stage }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        stage: [stage1, stage2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.stage }}

      - name: Install just
        uses: extractions/setup-just@v4

      # Both stages, not just stage 2. crap4rust is the coverage tool, so its
      # own validation tests drive the built binary through the path that
      # shells out to cargo llvm-cov -- without it, stage 1 fails with
      # `cargo llvm-cov failed with exit code Some(101)` and nothing about the
      # message says an install is missing.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      # Not cached: caching cargo-installed binaries makes `cargo install` skip
      # a reinstall even when a newer version is published, so the gate would
      # quietly keep testing against a stale tool.
      - name: Install house gate tools
        if: matrix.stage == 'stage2'
        run: |
          cargo install cargo-stern4rust
          cargo install cargo-twin4rust
          cargo install cargo-iceberg4rust

      # This repository is crap4rust. The gate measures it with the published
      # crap4rust rather than the one in the working tree, matching what the
      # PowerShell gate did.
      - name: Install crap4rust
        if: matrix.stage == 'stage2'
        run: cargo install cargo-crap4rust

      - name: Run ${{ matrix.stage }}
        run: just ${{ matrix.stage }}
