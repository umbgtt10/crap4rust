[workspace]
resolver = "2"
members = ["core", "cli", "validation", "xtask"]

# The fixture crates are analysis input, not code this workspace builds. They
# carry manifests because crap4rust is pointed at them as real packages, and
# they are excluded rather than made members so a deliberately-crappy fixture
# never has to satisfy the workspace's own build.
exclude = ["fixture"]

# The two published crates, core and cli, take these with `.workspace = true`,
# so they share one version and are bumped in one place.
[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/umbgtt10/crap4rust"

# Declared once here; every member takes them with `.workspace = true`, so a
# version is bumped in one place and no two members can disagree.
[workspace.dependencies]
anyhow = "1.0.98"
cargo_metadata = "0.23.1"
clap = { version = "4.5.39", features = ["derive"] }
crap4rust-core = { path = "core", version = "0.9.0" }
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
syn = { version = "2.0.101", features = ["full", "visit"] }
walkdir = "2.5.0"
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.20.0"

# Every member and every target: no `unsafe` anywhere in the workspace. core
# says so at its crate root as well.
[workspace.lints.rust]
unsafe_code = "forbid"
